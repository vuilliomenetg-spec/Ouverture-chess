<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ouvertures d'échecs</title>
<style>
html{background:#1b2420}
:root{--gold:#E8C468;--ink:#efeee9;--mute:#aab5ae;--panel:rgba(18,26,22,.86);--cell:max(28px,calc(min(92vw - 20px,100vh - 380px,460px)/8))}
@supports(height:100dvh){:root{--cell:max(28px,calc(min(92vw - 20px,100dvh - 380px,460px)/8))}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding:max(10px,env(safe-area-inset-top)) 10px 10px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 0%,rgba(0,0,0,0) 0%,rgba(0,0,0,.6) 100%),conic-gradient(#2a3a32 25%,#1b2621 0 50%,#2a3a32 0 75%,#1b2621 0) 0 0/88px 88px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.top{width:100%;display:flex;flex-direction:column;gap:8px}
.modes{display:flex;gap:8px}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:16px;font-weight:700;color:var(--gold);background:rgba(18,26,22,.7);border:2px solid var(--gold);border-radius:999px;height:46px;padding:0 8px;cursor:pointer;transition:transform .12s,background .12s}
.mode i{font-style:normal;font-size:21px;line-height:1}
.mode:active{transform:scale(.97)}
.mode.on{background:var(--gold);color:#2a2210;box-shadow:0 6px 18px rgba(232,196,104,.3)}
.obtn{width:100%;height:46px;display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:999px;background:rgba(18,26,22,.8);color:var(--ink);border:2px solid #55625a;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.obtn .nm{flex:1;text-align:left}
.obtn .sd{font-size:12px;font-weight:500;color:var(--mute)}
.obtn svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #8a948e;flex:none}
.dot.w{background:#F1EFE8}.dot.b{background:#14181a}
.card{background:var(--panel);border:1px solid rgba(232,196,104,.2);border-radius:22px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.stage{display:flex;flex-direction:column;align-items:center;gap:8px}
.frame{padding:10px;border-radius:20px;background:linear-gradient(145deg,#5b4330,#33241a);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.bd{display:grid;grid-template-columns:repeat(8,var(--cell));grid-template-rows:repeat(8,var(--cell));width:calc(var(--cell)*8);border-radius:10px;overflow:hidden;touch-action:manipulation}
.sq{position:relative;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell)*.8);line-height:1;user-select:none;-webkit-user-select:none}
.l{background:#EEEED2}.d{background:#769656}
.l.hl{background:#F6F669}.d.hl{background:#BACA2B}
.sel{box-shadow:inset 0 0 0 4px #3b8fe0}.hint{box-shadow:inset 0 0 0 4px #e0443b}
.pw{color:#fff;-webkit-text-stroke:1.2px #222;paint-order:stroke fill}
.pb{color:#1c1c1c;-webkit-text-stroke:.6px #000}
.cn{position:absolute;font-size:9px;font-weight:700;line-height:1;opacity:.75;-webkit-text-stroke:0}
.l .cn{color:#5b7a3d}.d .cn{color:#EEEED2}
.side{width:calc(var(--cell)*8 + 20px)}
#cap{height:76px;overflow-y:auto;font-size:15px;line-height:1.4}
#cap b{color:var(--gold)}
.ok{color:#8fd16a;font-weight:700}
.ctr{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.rb{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#2d3732;color:var(--ink);border:2px solid #55625a;cursor:pointer;padding:0;transition:transform .12s}
.rb:active{transform:scale(.92)}
.rb svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.rb.main{width:58px;height:58px;background:var(--gold);color:#2a2210;border-color:var(--gold);box-shadow:0 6px 16px rgba(232,196,104,.3)}
.rb.main svg{width:30px;height:30px}
.pill{font:inherit;font-size:15px;font-weight:700;color:#2a2210;background:var(--gold);border:0;border-radius:999px;padding:0 22px;height:48px;display:flex;align-items:center;gap:8px;cursor:pointer}
.pill svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill:active{transform:scale(.96)}
#ml{white-space:nowrap;overflow-x:auto;line-height:1.9;scrollbar-width:none;padding:2px 0}
#ml::-webkit-scrollbar{display:none}
.mv{display:inline-block;padding:0 9px;margin:0 2px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.07)}
.mv.cl{cursor:pointer}
.mv.on{background:var(--gold);color:#2a2210;font-weight:700}
.gl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:0 0 8px;text-transform:uppercase;letter-spacing:.8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chip{font:inherit;font-size:14px;font-weight:600;border-radius:999px;padding:9px 16px;border:2px solid transparent;cursor:pointer;transition:transform .12s}
.chip:active{transform:scale(.96)}
.chip.w{background:#F1EFE8;color:#1f1f1e}
.chip.b{background:#2d3732;color:#F1EFE8;border-color:#55625a}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,104,.4)}
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.open{display:block}
.sh-back{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fadeIn .25s}
.sh-body{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:#17201b;border-radius:26px 26px 0 0;border-top:1px solid rgba(232,196,104,.35);padding:10px 18px 26px;animation:slideUp .3s cubic-bezier(.3,.9,.3,1)}
.sh-h{width:44px;height:5px;border-radius:3px;background:#55625a;margin:0 auto 12px}
.sh-t{font-size:18px;font-weight:700;margin:0 0 14px;text-align:center}
#info{font-size:14px;color:var(--mute);text-align:center;margin:0}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@media(min-width:760px) and (min-aspect-ratio:5/4){
:root{--cell:max(30px,min(calc((100vh - 120px)/8),66px))}
.app{max-width:1000px}
.top{flex-direction:row}
.modes{flex:1.3}
.obtn{flex:1;width:auto}
.stage{flex-direction:row;align-items:flex-start;gap:18px}
.side{width:340px}
#cap{height:auto;min-height:110px}
}
.mode,.chip,.rb,.pill{position:relative;overflow:hidden}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sq .pw,.sq .pb{position:relative;z-index:2;display:block;transition:transform .15s}
.sq.sel .pw,.sq.sel .pb{transform:scale(1.18) translateY(-4px)}
.fade{animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop{animation:popIn .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes popIn{from{transform:scale(.93);opacity:.4}to{transform:none;opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.mv.on{animation:popIn .3s}
.cf{position:fixed;top:-20px;z-index:90;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.9}}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#22302a 0%,#0c110e 100%);transition:opacity .6s;overflow:hidden;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
#splash::before{content:"";position:absolute;inset:0;background:conic-gradient(rgba(255,255,255,.05) 25%,transparent 0 50%,rgba(255,255,255,.05) 0 75%,transparent 0) 0 0/88px 88px;animation:drift 10s linear infinite}
@keyframes drift{to{background-position:88px 88px}}
.sp-k{position:relative;font-size:104px;line-height:1;color:var(--gold);-webkit-text-stroke:1px #6b5416;animation:hop 1.4s ease-in-out both}
@keyframes hop{0%{opacity:0;transform:translate(-120px,30px) scale(.5)}12%{opacity:1}30%{transform:translate(-60px,-80px) scale(1.05)}50%{transform:translate(0,0)}62%{transform:translate(0,-38px)}76%{transform:translate(0,0) scale(1.18,.86)}100%{transform:none}}
.sp-row{position:relative;display:flex;gap:2px;margin-top:10px;font-size:min(8.6vw,42px)}
.sp-row span{display:block;color:#F1EFE8;-webkit-text-stroke:1px #111;animation:drop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*.09s + .55s)}
.sp-row span:nth-child(even){color:var(--gold)}
@keyframes drop{from{opacity:0;transform:translateY(-140px) rotate(-35deg)}to{opacity:1;transform:none}}
.sp-t{position:relative;font-size:30px;font-weight:700;margin-top:16px;animation:rise .7s 1.1s both}
.sp-s{position:relative;margin-top:6px;font-size:14px;color:var(--gold);letter-spacing:.5px;animation:rise .6s 1.6s both,pulse 1.6s 2.3s infinite}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
.sp-by{position:relative;margin-top:22px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);animation:rise .6s 1.7s both}
.sig-svg{position:relative;width:min(88vw,360px);height:auto;overflow:visible}
.sg{fill:transparent;stroke:#E8C468;stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sdraw .85s calc(2.1s + var(--i)*.1s) ease-in-out forwards,sfill .5s calc(2.75s + var(--i)*.1s) ease-out forwards}
.sig-ul{fill:none;stroke:#E8C468;stroke-width:2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:sul .8s 4.9s ease-out forwards}
@keyframes sdraw{to{stroke-dashoffset:0}}
@keyframes sfill{to{fill:#E8C468;stroke-width:.3}}
@keyframes sul{to{stroke-dashoffset:0}}
.sp-s{animation:rise .6s 5.6s both,pulse 1.6s 6.3s infinite!important}
.pc{display:inline-block;min-width:44px;text-align:center;font-size:12px;font-weight:800;line-height:1;padding:4px 7px;border-radius:999px;margin-left:7px;vertical-align:1px}
.pc.hi{background:#8fd16a;color:#12310a}.pc.mid{background:#E8C468;color:#2a2210}.pc.lo{background:#f19a8e;color:#3a0f0a}
.obtn .pc{margin:0 2px 0 0}
.gsum{margin:-4px 0 16px;text-align:center;font-size:14px;color:var(--mute)}
.gsum b{color:var(--gold)}
.rst-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.rst{font:inherit;font-size:13px;font-weight:700;color:#f19a8e;background:transparent;border:2px solid #7a4a44;border-radius:999px;padding:9px 14px;cursor:pointer}
.rst:active{transform:scale(.96)}
.dlg{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.65)}
.dlg.open{display:flex;animation:fadeIn .2s}
.dlg-b{width:100%;max-width:360px;background:#17201b;border:1px solid rgba(232,196,104,.35);border-radius:26px;padding:22px 20px 18px;text-align:center;animation:popIn .3s cubic-bezier(.3,1.4,.5,1)}
.dlg-t{font-size:19px;font-weight:700;margin:0 0 8px}
.dlg-b p{margin:0 0 18px;color:var(--mute);font-size:15px}
.dlg-a{display:flex;gap:10px}
.pillbtn{flex:1;font:inherit;font-size:15px;font-weight:700;height:48px;border-radius:999px;border:0;cursor:pointer;background:var(--gold);color:#2a2210}
.pillbtn.cancel{background:#2d3732;color:var(--ink);border:2px solid #55625a}
.pillbtn.danger{background:#e0584a;color:#fff}
.pillbtn:active{transform:scale(.96)}
</style>
</head>

var b=$('board'),cell=b.firstChild?b.firstChild.offsetWidth:0;if(!cell)return;

var a=xy(r.last[k]),t=xy(r.last[k+1]),sq=b.querySelector('[data-sq="'+r.last[k+1]+'"]'),pc=sq&&sq.querySelector('.pw,.pb');

}else{

}

}

function jump(i){idx=i;draw();}
function clk(s){
if(!userTurn())return;
var o=O(),p=pos().p,pc=p[s],mine=pc&&((pc===pc.toUpperCase())===(o.s==='w'));
if(sel===null){if(mine){sel=s;hintL=0;draw();}return;}
if(s===sel){sel=null;draw();return;}
if(mine){sel=s;draw();return;}
var exp=mvs(o.st[idx][1])[0];
if(sel===exp[0]&&s===exp[1]){
if(tries===0)score++;

}
